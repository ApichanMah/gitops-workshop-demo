apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-app
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/max-bastin/gitops-workshop-demo
        revision: main
        directories:
          - path: demo-app/*
  template:
    metadata:
      name: 'demo-app-{{.path.basenameNormalized}}'
    spec:
      project: demo
      source:
        repoURL: https://github.com/max-bastin/gitops-workshop-demo
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: demo
      syncPolicy:
        automated:
          selfHeal: true
