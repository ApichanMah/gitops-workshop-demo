apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-staging
spec:
  selector:
    matchLabels:
      app: demo-app-staging
  replicas: 1
  template:
    metadata:
      name: demo-app-staging
      labels:
        app: demo-app-staging
    spec:
      containers:
        - name: demo-container
          image: public.ecr.aws/viadee/k8s-demo-app-native:1.4.0-rc3
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              memory: 100Mi
              cpu: 100m
            requests:
              memory: 100Mi
              cpu: 100m
          envFrom:
            - configMapRef:
                name: app-config
                optional: true
      restartPolicy: Always
